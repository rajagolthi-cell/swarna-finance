<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Jewellery Business | Swarna Finance</title><link rel="stylesheet" href="/platform.css"><script defer src="/platform.js"></script><link rel="stylesheet" href="/luxury-platform.css"><link rel="stylesheet" href="/reference-design.css"></head><body><header class="top">✦ Swarna Finance<small>BUSINESS REGISTRATION</small></header><main class="wrap"><section class="panel"><h1>Register your jewellery business</h1><p>Apply to join Swarna Finance. Applications require approval from the platform administrator.</p><form id="application" class="grid"><div><label>Owner full name *</label><input name="owner_name" maxlength="80" required></div><div><label>Email address *</label><input type="email" name="email" maxlength="150" required></div><div><label>Phone number *</label><input name="phone" type="tel" required></div><div><label>Business name *</label><input name="business_name" maxlength="80" required></div><div><label>Business type *</label><select name="business_type" required><option value="">Choose type</option><option>Jewellery retailer</option><option>Gold finance</option><option>Both</option></select></div><div><label>GSTIN (optional)</label><input name="gstin" maxlength="20"></div><div class="full"><label>Business street address *</label><input name="address" required></div><div><label>City *</label><input name="city" required></div><div><label>State *</label><input name="state" required></div><div><label>PIN code *</label><input name="pincode" inputmode="numeric" pattern="[0-9]{6}" required></div><div class="full"><label>Additional notes</label><textarea name="notes" maxlength="500"></textarea></div><div class="full"><button type="submit" class="btn">Submit application</button></div></form><div id="message" class="msg" role="status"></div><a href="/">Back to sign in</a></section></main></body></html>
